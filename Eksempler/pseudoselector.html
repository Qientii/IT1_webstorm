<!DOCTYPE html>
<html lang="nb">
<head>
    <style>
           p::first-letter {
           font-size: 5em;
       }
       p::first-line {
           color: darkorange;
       }
       p::selection {
           color: blue;
           background-color: red;
       }
       p:hover{
           cursor: crosshair;
       }
       q::before {
           content: "!";
       }
        q::after {
           content: "»";
       }
</style>
 </head>
<body>
<p>I dag leste jeg en artikkel i avisen hvor lederen for
    en naturvernorganisasjon skriver: <q>Korallrevene dør.
</q> Det var skremmende lesing.</p>

</body>

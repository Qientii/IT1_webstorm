<!DOCTYPE html>
<html lang="nb">
<head>
    <meta charset="UTF-8">
    <title>Audio</title>
    <link rel="icon" type="image/svg+xml" href="../bilder/gta.svg" />
    <style>
        table, th, td {
            border:2px solid black;
            border-collapse: collapse;
        }
        th, td {
            padding:15px;
            width: 160px;

        }
        td {text-align: right;}

    </style>
</head>

<body>

<h2>TH elements define table headers</h2>

<table style="width:100%">
    <thead>
    <tr>
        <th colspan="2">Person 1</th>
        <th>Person 2</th>
        <th>Person 3</th>
    </tr>
    </thead>
    <tbody>
    <tr>
        <td rowspan="2">Emil</td>
        <td>Tobias</td>
        <td>Linus</td>
    </tr>
    <tr>
        <td>16</td>
        <td>14</td>
        <td>10</td>
    </tr>
    </tbody>
</table>
</body>
</html>

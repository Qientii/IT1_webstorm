<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Skjema</title>
    <link rel="icon" type="image/svg+xml" href="../bilder/gta.jpg"/>
</head>
<body>
<form action="registrer.html">
    <label>Navn: </label>
    <input type="text" name="navn" required placeholder="Skriv inn navn" autofocus>
    <br>
    <label>Alder: </label>
    <input type="number" min="0" max="120" name="alder" required placeholder="Skriv inn alder">
    <br>
    <button type="submit">Registrer navn og alder</button>
</form>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Display2</title>
    <style>
        .box {
            min-width: 100px;
            width:100px;
            height:100px;
            background-color:mediumvioletred;
            border:2px solid black;

        }
        .liste {
            display:flex;
            width:600px;
            height:600px;
            border:3px solid;
            flex-direction: column-reverse;
            align-items: center;
            justify-content: space-evenly;
            gap: 20px;
            flex-grow: 0;
            flex-shrink: 0;
        }
        #box-1 {
            align-self: end;
        }
    </style>
</head>
<body>
<div class="liste">
    <div class="box" id="box-1">1</div>
    <div class="box">2</div>
    <div class="box">3</div>
    <div class="box">4</div>
    <div class="box">5</div>


</div>
</body>
</html>

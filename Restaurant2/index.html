<!doctype html>
<html lang="nb">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
          rel="stylesheet">

    <link rel="stylesheet" href="index.css">
    <link rel="icon" type="image/svg+xml" href="hamburger.png" />

    <title>Matbestilling</title>
</head>

<body>

<div class="bestillingskort">

    <h1 class="sidetittel">Lag din bestilling</h1>

    <form class="bestillingsskjema" action="registrering.html">

        <!-- Informasjon om kunden og levering -->
        <div class="kundeseksjon">

            <div class="feltgruppe">
                <label class="feltetikett" for="kundenavn">Kundenavn</label>

                <input
                        class="tekstfelt"
                        id="kundenavn"
                        name="navn"
                        type="text"
                        placeholder="Skriv inn navn"
                        required>

            </div>

            <div class="feltgruppe">
                <label class="feltetikett" for="antall">Antall</label>

                <input
                        class="tekstfelt"
                        id="antall"
                        name="antall"
                        type="number"
                        min="1"
                        max="10"
                        value="1">
            </div>

            <div class="feltgruppe">
                <label class="feltetikett" for="bestillingsdato">Bestillingsdato</label>

                <input
                        class="tekstfelt"
                        id="bestillingsdato"
                        name="dato"
                        type="date"
                        required>
            </div>

            <div class="feltgruppe">
                <label class="feltetikett" for="leveringstid">Leveringstid</label>

                <select
                        class="valgfelt"
                        id="leveringstid"
                        name="leveringstid"
                        required>

                    <option value="">Velg leveringstid</option>
                    <option value="07-09">07:00–09:00</option>
                    <option value="09-11">09:00–11:00</option>
                    <option value="11-13">11:00–13:00</option>
                    <option value="13-15">13:00–15:00</option>
                    <option value="15-17">15:00–17:00</option>
                    <option value="17-19">17:00–19:00</option>
                    <option value="19-21">19:00–21:00</option>
                    <option value="21-23">21:00–23:00</option>

                </select>
            </div>

            <div class="feltgruppe">
                <label class="feltetikett" for="kortnummer">Kortnummer</label>

                <input
                        class="kortfelt"
                        id="kortnummer"
                        name="kortnummer"
                        type="text"
                        placeholder="0000-0000-0000-0000"
                        pattern="[0-9]{4}-[0-9]{4}-[0-9]{4}-[0-9]{4}"
                        maxlength="19"
                        required>
            </div>

        </div>


        <div class="menyseksjon">

            <div class="menygruppe">

                <p class="gruppetittel">Velg drikke</p>

                <div class="valgliste">

                    <input
                            id="cola"
                            name="drikke"
                            type="radio"
                            value="cola">

                    <label for="cola">Cola</label>


                    <input
                            id="vann"
                            name="drikke"
                            type="radio"
                            value="vann">

                    <label for="vann">Vann</label>


                    <input
                            id="kaffe"
                            name="drikke"
                            type="radio"
                            value="kaffe">

                    <label for="kaffe">Kaffe</label>


                    <input
                            id="fanta"
                            name="drikke"
                            type="radio"
                            value="fanta">

                    <label for="fanta">Fanta</label>

                </div>
            </div>


            <div class="menygruppe">

                <p class="gruppetittel">Velg hovedrett</p>

                <div class="valgliste">

                    <input
                            id="hamburger"
                            name="hovedrett"
                            type="radio"
                            value="hamburger">

                    <label for="hamburger">
                        Hamburger
                    </label>


                    <input
                            id="pizza"
                            name="hovedrett"
                            type="radio"
                            value="pizza">

                    <label for="pizza">
                        Pizza
                    </label>


                    <input
                            id="polse"
                            name="hovedrett"
                            type="radio"
                            value="polse">

                    <label for="polse">
                        Pølse
                    </label>

                </div>
            </div>


            <div class="menygruppe">

                <div class="feltgruppe">

                    <label class="gruppetittel" for="siderett">
                        Velg siderett
                    </label>

                    <select
                            class="valgfelt"
                            id="siderett"
                            name="siderett">

                        <option value="">Velg en siderett</option>
                        <option value="pommes-frites">Pommes frites</option>
                        <option value="lokringer">Løkringer</option>
                        <option value="salat">Salat</option>

                    </select>

                </div>
            </div>


            <div class="menygruppe">

                <p class="gruppetittel">Velg ekstra tilbehør</p>

                <div class="valgliste">

                    <input
                            id="ketsjup"
                            name="ekstra"
                            type="checkbox"
                            value="ketsjup">

                    <label for="ketsjup">
                        Ketsjup
                    </label>


                    <input
                            id="sennep"
                            name="ekstra"
                            type="checkbox"
                            value="sennep">

                    <label for="sennep">
                        Sennep
                    </label>


                    <input
                            id="salt"
                            name="ekstra"
                            type="checkbox"
                            value="salt">

                    <label for="salt">
                        Salt
                    </label>

                </div>
            </div>

        </div>


        <button class="sendknapp" type="submit">
            Send bestilling
        </button>

    </form>

</div>

</body>
</html>
